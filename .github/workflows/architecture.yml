name: Architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - run: npm ci
      - run: npm run architecture:verify
      - run: node --test tools/tests/architecture-guard.test.js
      - run: node --test tools/tests/event-references.test.js
      - run: node --test tools/tests/timeline-tooltip.test.js
      - run: node --test tools/tests/character-references.test.js
      - run: node --test tools/tests/character-excerpt.test.js
      - run: node --test tools/tests/character-facts.test.js
      - run: node --test tools/tests/organization-members.test.js
      - run: node --test tools/tests/entry-detail.test.js
      - run: node --test tools/tests/entry-source-validation.test.js
      - run: node --test tools/tests/creature-directory.test.js
      - run: npm run related:check
      - run: node --test tools/tests/wiki-link-hints.test.js
      - run: node --test tools/tests/relationship-query.test.js
      - run: node tools/test-relationship-chronology.js
      - run: node --test tools/tests/character-records.test.js
      - run: node --test tools/tests/character-relations-validation.test.js
      - run: npm run catalog:check
