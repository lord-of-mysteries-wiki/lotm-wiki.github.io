<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>事实反馈</title></head>
<body><main><div class="feedback-intro"><h1>事实反馈</h1><p>请填写需要更正的内容，并附上作品、章节和适用时期。</p></div>
<form id="fact-feedback">
<label>相关页面或网址<input name="page" maxlength="500" required></label>
<label>您的意见<textarea name="claim" rows="5" maxlength="4000" required></textarea></label>
<label>参考依据<textarea name="source" rows="4" maxlength="3000" required placeholder="作品名称、章节和适用时期"></textarea></label>
<button type="submit">提交反馈</button><p id="status" role="status"></p>
<p>反馈将公开，请勿填写个人隐私信息。</p></form></main><script type="module" src="/src/main.js"></script></body></html>
